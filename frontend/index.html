<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkillSwap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1b1f4b;
  --ink-soft: #2c3170;
  --paper: #f3f4fb;
  --card: #ffffff;
  --teal: #0f9d8a;
  --coin: #f5b82e;
  --text: #22254a;
  --muted: #6b6f93;
  --line: #e1e3f2;
  --danger: #c8443a;
}
* { box-sizing: border-box; margin: 0; }
body { font-family: 'DM Sans', system-ui, sans-serif; background: var(--paper); color: var(--text); min-height: 100vh; }
h1, h2, h3, .brand { font-family: 'Sora', system-ui, sans-serif; }
button, input, select, textarea { font: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

.auth { min-height: 100vh; display: grid; grid-template-columns: 1.1fr 1fr; }
.auth-hero { background: var(--ink); color: #fff; padding: 72px; display: flex; flex-direction: column; justify-content: center; gap: 20px; }
.auth-hero h1 { font-size: 46px; line-height: 1.1; max-width: 520px; }
.auth-hero p { color: #b9bde6; max-width: 440px; line-height: 1.6; }
.auth-form { display: flex; align-items: center; justify-content: center; padding: 32px; }
.auth-form form { width: 100%; max-width: 360px; display: grid; gap: 14px; }
.auth-form h2 { font-size: 26px; }

.shell { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }
.side { background: var(--ink); color: #fff; padding: 28px 18px; display: flex; flex-direction: column; gap: 6px; position: sticky; top: 0; height: 100vh; }
.brand { font-size: 22px; padding: 0 12px 22px; }
.avatar { border-radius: 50%; object-fit: cover; flex: none; background: var(--ink-soft); }
.avatar.initials { display: inline-flex; align-items: center; justify-content: center; color: #fff; font-family: 'Sora', system-ui, sans-serif; font-weight: 700; }
.who { display: flex; gap: 14px; align-items: center; }
.me { display: flex; align-items: center; gap: 10px; margin-top: auto; padding: 10px 12px; font-size: 14px; }
.nav { background: none; border: 0; color: #b9bde6; text-align: left; padding: 11px 12px; border-radius: 8px; cursor: pointer; }
.nav:hover { background: var(--ink-soft); color: #fff; }
.nav.on { background: var(--ink-soft); color: #fff; box-shadow: inset 3px 0 0 var(--coin); }
.wallet { margin-top: 8px; background: var(--ink-soft); border-radius: 12px; padding: 16px; }
.wallet strong { font-family: 'Sora', sans-serif; font-size: 30px; color: var(--coin); display: block; }
.wallet span { color: #b9bde6; font-size: 13px; }
.main { padding: 40px 48px; max-width: 1000px; }
.main h2 { font-size: 28px; margin-bottom: 6px; }
.sub { color: var(--muted); margin-bottom: 24px; }

.bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
input, select, textarea { padding: 11px 13px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--text); }
.bar input { flex: 1; min-width: 200px; }
textarea { width: 100%; resize: vertical; }
.btn { display: inline-block; background: var(--teal); color: #fff; border: 0; padding: 11px 18px; border-radius: 8px; cursor: pointer; font-weight: 500; }
.btn:hover { background: #0c8676; }
.btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
.btn.danger { background: var(--danger); }
.btn.small { padding: 8px 12px; font-size: 14px; }

.list { display: grid; gap: 12px; }
.row { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.row h3 { font-size: 17px; margin-bottom: 4px; }
.meta { color: var(--muted); font-size: 14px; }
.tag { background: #e6f6f3; color: var(--teal); border-radius: 20px; padding: 3px 10px; font-size: 13px; margin-left: 6px; }
.tag.gold { background: #fdf3d9; color: #9a6b00; }
.tag.red { background: #fbe6e4; color: var(--danger); }
.actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 22px; margin-bottom: 20px; display: grid; gap: 12px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.stat strong { font-family: 'Sora', sans-serif; font-size: 26px; display: block; }
.empty { color: var(--muted); padding: 28px; text-align: center; border: 1px dashed var(--line); border-radius: 12px; }
.toast { position: fixed; bottom: 24px; right: 24px; background: var(--ink); color: #fff; padding: 13px 18px; border-radius: 10px; max-width: 340px; }
.hidden { display: none !important; }

@media (max-width: 800px) {
  .auth, .shell, .grid2 { grid-template-columns: 1fr; }
  .auth-hero { padding: 36px 24px; }
  .auth-hero h1 { font-size: 32px; }
  .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; }
  .brand { padding: 0 12px 0 0; }
  .me { display: none; }
  .wallet { margin: 0 0 0 auto; padding: 8px 14px; }
  .wallet strong { font-size: 20px; display: inline; }
  .main { padding: 24px 18px; }
  .stats { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>

<section id="auth" class="auth hidden">
  <div class="auth-hero">
    <div class="brand">SkillSwap</div>
    <h1>Teach what you know. Learn what you don't.</h1>
    <p>A peer-to-peer skill exchange for students of our college. Every session you teach earns a credit, and every session you attend spends one.</p>
  </div>
  <div class="auth-form">
    <form id="authForm">
      <h2 id="authTitle">Log in</h2>
      <input id="name" placeholder="Full name" class="hidden">
      <input id="email" type="email" placeholder="you@vivacollege.org" required>
      <input id="password" type="password" placeholder="Password" required>
      <button class="btn" id="authSubmit">Log in</button>
      <button type="button" class="btn ghost" id="authToggle">Create an account</button>
    </form>
  </div>
</section>

<div id="app" class="shell hidden">
  <aside class="side">
    <div class="brand">SkillSwap</div>
    <button class="nav" data-view="discover">Discover skills</button>
    <button class="nav" data-view="matches">My matches</button>
    <button class="nav" data-view="sessions">Sessions</button>
    <button class="nav" data-view="profile">Profile and credits</button>
    <button class="nav hidden" data-view="admin" id="adminNav">Admin panel</button>
    <button class="nav" id="logout">Log out</button>
    <div class="me" id="me"></div>
    <div class="wallet"><strong id="credits">0</strong><span id="escrow"></span></div>
  </aside>
  <main class="main" id="content"></main>
</div>

<div id="toast" class="toast hidden"></div>

<script>
const CATEGORIES = ['Programming', 'Web Development', 'Mobile Development', 'Data and AI', 'Design', 'Languages', 'Academics'];
const state = { token: localStorage.getItem('token'), me: null, view: 'discover', registering: false };

const $ = (selector) => document.querySelector(selector);
const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const options = (list, selected) => list.map((item) => `<option ${item === selected ? 'selected' : ''}>${item}</option>`).join('');
function avatar(name, image, size = 44) {
  const box = `width:${size}px;height:${size}px`;
  if (image) return `<img class="avatar" style="${box}" src="${esc(image)}" alt="${esc(name)}">`;
  return `<span class="avatar initials" style="${box};font-size:${Math.round(size / 2.5)}px">${esc(name.trim().charAt(0).toUpperCase())}</span>`;
}

function resizeImage(file, size = 192) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const side = Math.min(img.width, img.height);
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = size;
      canvas.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, size, size);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => reject(new Error('That file is not a valid image'));
    img.src = url;
  });
}

const stars = (value) => (value ? `${value} stars` : 'No reviews yet');

async function api(path, method = 'GET', body) {
  const headers = { 'Content-Type': 'application/json' };
  if (state.token) headers.Authorization = `Bearer ${state.token}`;
  const res = await fetch(`/api${path}`, { method, headers, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Something went wrong');
  return data;
}

function toast(message) {
  const box = $('#toast');
  box.textContent = message;
  box.classList.remove('hidden');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => box.classList.add('hidden'), 3200);
}

async function run(task, success) {
  try {
    await task();
    if (success) toast(success);
  } catch (error) {
    toast(error.message);
  }
}

function skillCard(skill) {
  return `
    <div class="row">
      <div class="who">
        ${avatar(skill.tutor, skill.avatar, 48)}
        <div>
          <h3>${esc(skill.title)}<span class="tag">${esc(skill.category)}</span>${skill.mutual ? '<span class="tag gold">Mutual swap</span>' : ''}</h3>
          <div class="meta">${esc(skill.tutor)} · ${stars(skill.reputation)}${skill.reviewCount ? ` (${skill.reviewCount})` : ''}</div>
          <div class="meta">${skill.availability ? 'Free: ' + esc(skill.availability) : 'Availability not shared yet'}</div>
        </div>
      </div>
      <div class="actions">
        <input type="datetime-local" id="slot-${skill.id}">
        <button class="btn small" onclick="book(${skill.id})">Book for 1 credit</button>
      </div>
    </div>`;
}

function book(skillId) {
  const slot = $(`#slot-${skillId}`).value;
  run(async () => {
    await api('/sessions', 'POST', { skillId, slot });
    await refresh();
  }, 'Request sent. Your credit is held until the session is done');
}

const views = {
  async discover() {
    const q = $('#q')?.value || '';
    const category = $('#cat')?.value || '';
    const skills = await api(`/skills?q=${encodeURIComponent(q)}&category=${encodeURIComponent(category)}`);
    return `
      <h2>Discover skills</h2>
      <p class="sub">Find a classmate who can teach you something new.</p>
      <div class="bar">
        <input id="q" placeholder="Search for React, Flutter, Python..." value="${esc(q)}" onkeydown="if(event.key==='Enter')render()">
        <select id="cat" onchange="render()"><option value="">All categories</option>${options(CATEGORIES, category)}</select>
        <button class="btn" onclick="render()">Search</button>
      </div>
      <div class="list">${skills.length ? skills.map(skillCard).join('') : '<div class="empty">No skills match this search. Try another keyword.</div>'}</div>`;
  },

  async matches() {
    const matches = await api('/matches');
    return `
      <h2>My matches</h2>
      <p class="sub">Tutors who teach what you asked to learn. Mutual swaps come first.</p>
      <div class="list">${matches.length ? matches.map(skillCard).join('') : '<div class="empty">No matches yet. Add skills you want to learn on your profile.</div>'}</div>`;
  },

  async sessions() {
    const sessions = await api('/sessions');
    const card = (s) => {
      const teaching = s.teacher_id === state.me.user.id;
      let actions = '';
      if (teaching && s.status === 'pending') {
        actions = `<button class="btn small" onclick="respond(${s.id}, 'accept')">Accept</button>
                   <button class="btn small danger" onclick="respond(${s.id}, 'reject')">Decline</button>`;
      } else if (teaching && s.status === 'accepted') {
        actions = `<input id="code-${s.id}" placeholder="Learner's code" size="12">
                   <button class="btn small" onclick="complete(${s.id})">Confirm session</button>`;
      } else if (!teaching && s.status === 'accepted') {
        actions = `<span class="tag gold">Your code: ${esc(s.code)}</span>`;
      } else if (!teaching && s.status === 'completed' && !s.reviewed) {
        actions = `<select id="rate-${s.id}">${[5, 4, 3, 2, 1].map((n) => `<option value="${n}">${n} stars</option>`).join('')}</select>
                   <input id="note-${s.id}" placeholder="Write a short review">
                   <button class="btn small" onclick="review(${s.id})">Post review</button>`;
      }
      const statusClass = s.status === 'rejected' ? 'red' : s.status === 'completed' ? '' : 'gold';
      return `
        <div class="row">
          <div>
            <h3>${esc(s.title)}<span class="tag ${statusClass}">${s.status}</span></h3>
            <div class="meta">${teaching ? 'Teaching ' + esc(s.learner) : 'Learning from ' + esc(s.teacher)} · ${esc(s.slot.replace('T', ' '))}</div>
          </div>
          <div class="actions">${actions}</div>
        </div>`;
    };
    return `
      <h2>Sessions</h2>
      <p class="sub">Requests you sent and requests waiting for you.</p>
      <div class="list">${sessions.length ? sessions.map(card).join('') : '<div class="empty">No sessions yet. Book one from Discover skills.</div>'}</div>`;
  },

  async profile() {
    const { user, skills, ledger, notifications } = state.me;
    const skillRow = (s) => `
      <div class="row"><div><h3>${esc(s.title)}<span class="tag">${esc(s.category)}</span></h3>
      <div class="meta">${s.kind === 'offer' ? 'I can teach this' : 'I want to learn this'}</div></div>
      <button class="btn ghost small" onclick="removeSkill(${s.id})">Remove</button></div>`;
    return `
      <div class="who" style="margin-bottom:24px">
        ${avatar(user.name, user.avatar, 88)}
        <div>
          <h2 style="margin-bottom:4px">${esc(user.name)}</h2>
          <p class="meta">${esc(user.email)} · Reputation: ${stars(user.reputation)}</p>
          <div class="actions" style="margin-top:10px">
            <label class="btn small" for="photo" style="cursor:pointer">${user.avatar ? 'Change photo' : 'Upload photo'}</label>
            <input type="file" id="photo" accept="image/*" hidden onchange="uploadPhoto(this)">
            ${user.avatar ? '<button class="btn ghost small" onclick="removePhoto()">Remove</button>' : ''}
          </div>
        </div>
      </div>
      <div class="panel">
        <textarea id="bio" rows="3" placeholder="Short bio">${esc(user.bio)}</textarea>
        <input id="availability" placeholder="When are you free? e.g. Weekdays after 4 PM" value="${esc(user.availability)}">
        <div><button class="btn" onclick="saveProfile()">Save profile</button></div>
      </div>
      <div class="panel">
        <h3>Add a skill</h3>
        <div class="bar" style="margin:0">
          <input id="skillTitle" placeholder="e.g. Flutter basics">
          <select id="skillCategory">${options(CATEGORIES)}</select>
          <select id="skillKind"><option value="offer">I can teach</option><option value="request">I want to learn</option></select>
          <button class="btn" onclick="addSkill()">Add skill</button>
        </div>
      </div>
      <div class="list" style="margin-bottom:24px">${skills.map(skillRow).join('') || '<div class="empty">Add a skill you can teach to start earning credits.</div>'}</div>
      <div class="grid2">
        <div><h3 style="margin-bottom:10px">Credit history</h3><div class="list">
          ${ledger.map((l) => `<div class="row"><div><strong>${l.type}</strong><div class="meta">${l.created_at}</div></div><strong>${l.amount > 0 ? '+' : ''}${l.amount}</strong></div>`).join('') || '<div class="empty">No transactions yet.</div>'}
        </div></div>
        <div><h3 style="margin-bottom:10px">Notifications</h3><div class="list">
          ${notifications.map((n) => `<div class="row"><div>${esc(n.message)}<div class="meta">${n.created_at}</div></div></div>`).join('') || '<div class="empty">You are all caught up.</div>'}
        </div></div>
      </div>`;
  },

  async admin() {
    const { stats, users } = await api('/admin/overview');
    return `
      <h2>Admin panel</h2>
      <p class="sub">Monitor activity and suspend accounts that break the rules.</p>
      <div class="stats">
        <div class="stat"><strong>${stats.students}</strong>Students</div>
        <div class="stat"><strong>${stats.skills}</strong>Skills listed</div>
        <div class="stat"><strong>${stats.sessions}</strong>Sessions booked</div>
        <div class="stat"><strong>${stats.completed}</strong>Sessions completed</div>
      </div>
      <div class="list">${users.map((u) => `
        <div class="row">
          <div><h3>${esc(u.name)}${u.flagged ? '<span class="tag red">Suspended</span>' : ''}</h3>
          <div class="meta">${esc(u.email)} · ${u.credits} credits · ${stars(u.reputation)}</div></div>
          <button class="btn small ${u.flagged ? 'ghost' : 'danger'}" onclick="flagUser(${u.id})">${u.flagged ? 'Restore account' : 'Suspend account'}</button>
        </div>`).join('') || '<div class="empty">No students have registered yet.</div>'}</div>`;
  },
};

async function render() {
  document.querySelectorAll('.nav[data-view]').forEach((b) => b.classList.toggle('on', b.dataset.view === state.view));
  try {
    $('#content').innerHTML = await views[state.view]();
  } catch (error) {
    toast(error.message);
  }
}

async function refresh() {
  state.me = await api('/me');
  const { user } = state.me;
  $('#me').innerHTML = `${avatar(user.name, user.avatar, 38)}<span>${esc(user.name)}</span>`;
  $('#credits').textContent = user.credits;
  $('#escrow').textContent = user.escrow ? `credits · ${user.escrow} held for bookings` : 'credits available';
  $('#adminNav').classList.toggle('hidden', user.role !== 'admin');
  await render();
}

const respond = (id, action) => run(async () => { await api(`/sessions/${id}/respond`, 'POST', { action }); await refresh(); }, action === 'accept' ? 'Session accepted' : 'Request declined');
const complete = (id) => run(async () => { await api(`/sessions/${id}/complete`, 'POST', { code: $(`#code-${id}`).value }); await refresh(); }, 'Session confirmed. Credit added to your balance');
const review = (id) => run(async () => { await api('/reviews', 'POST', { sessionId: id, rating: Number($(`#rate-${id}`).value), comment: $(`#note-${id}`).value }); await refresh(); }, 'Review posted');
const removePhoto = () => run(async () => { await api('/me/avatar', 'PUT', { image: '' }); await refresh(); }, 'Photo removed');
async function uploadPhoto(input) {
  const file = input.files[0];
  if (!file) return;
  await run(async () => {
    const image = await resizeImage(file);
    await api('/me/avatar', 'PUT', { image });
    await refresh();
  }, 'Profile photo updated');
}
const saveProfile = () => run(async () => { await api('/me', 'PUT', { bio: $('#bio').value, availability: $('#availability').value }); await refresh(); }, 'Profile saved');
const addSkill = () => run(async () => { await api('/skills', 'POST', { title: $('#skillTitle').value, category: $('#skillCategory').value, kind: $('#skillKind').value }); await refresh(); }, 'Skill added');
const removeSkill = (id) => run(async () => { await api(`/skills/${id}`, 'DELETE'); await refresh(); }, 'Skill removed');
const flagUser = (id) => run(async () => { await api(`/admin/users/${id}/flag`, 'POST'); await render(); }, 'Account updated');

function showAuth() {
  $('#auth').classList.remove('hidden');
  $('#app').classList.add('hidden');
  $('#name').classList.toggle('hidden', !state.registering);
  $('#authTitle').textContent = state.registering ? 'Create your account' : 'Log in';
  $('#authSubmit').textContent = state.registering ? 'Create account' : 'Log in';
  $('#authToggle').textContent = state.registering ? 'I already have an account' : 'Create an account';
}

async function start() {
  if (!state.token) return showAuth();
  try {
    $('#auth').classList.add('hidden');
    $('#app').classList.remove('hidden');
    await refresh();
  } catch {
    localStorage.removeItem('token');
    state.token = null;
    showAuth();
  }
}

$('#authToggle').onclick = () => { state.registering = !state.registering; showAuth(); };
$('#authForm').onsubmit = (event) => {
  event.preventDefault();
  run(async () => {
    const body = { email: $('#email').value, password: $('#password').value };
    if (state.registering) body.name = $('#name').value;
    const { token } = await api(state.registering ? '/auth/register' : '/auth/login', 'POST', body);
    state.token = token;
    localStorage.setItem('token', token);
    state.view = 'discover';
    await start();
  });
};
document.querySelectorAll('.nav[data-view]').forEach((button) => {
  button.onclick = () => { state.view = button.dataset.view; render(); };
});
$('#logout').onclick = () => { localStorage.removeItem('token'); state.token = null; showAuth(); };

start();
</script>
</body>
</html>
